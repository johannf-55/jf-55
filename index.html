<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#004993">
  <script>try{var t=localStorage.getItem("cfg_theme");if(t==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Audit énergie — Carbone Ingénierie</title>
  <link rel="preload" href="fonts/adventor-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="no-nav">
    <header id="top">
      <button id="back" class="icon" aria-label="Retour" hidden>←</button>
      <img id="logo" class="logo" src="icons/logo-blanc.png" alt="Carbone Ingénierie" hidden>
      <h1 id="title">Audit énergie</h1>
      <span id="pill" class="pill" role="status"></span>
      <button id="btnSync" class="icon" aria-label="Synchroniser" title="Synchroniser avec SharePoint">⟳</button>
      <button id="btnSettings" class="icon" aria-label="Réglages" title="Réglages">⚙</button>
    </header>
    <nav id="nav" aria-label="Sections de l’audit" hidden></nav>
    <main id="main"></main>
  </div>
  <dialog id="dlg"></dialog>
  <dialog id="dlg2"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
